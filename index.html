<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Розовый таймер + чат</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg, #ff9ecf, #ff4da6);
  color: white;
  text-align: center;
  padding: 30px;
}

.card {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  padding: 25px;
  border-radius: 20px;
  display: inline-block;
  width: 350px;
}

#timer {
  font-size: 40px;
  margin: 20px 0;
}

button {
  padding: 10px;
  margin: 5px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

#start-btn { background: #ff66b2; }
#pause-btn { background: #ff99cc; }
#stop-btn { background: #ff3385; }

input {
  padding: 8px;
  margin: 5px;
  border-radius: 8px;
  border: none;
  width: 90%;
}

#chat {
  margin-top: 20px;
  height: 200px;
  overflow-y: auto;
  background: rgba(0,0,0,0.2);
  padding: 10px;
  border-radius: 10px;
  text-align: left;
}
</style>
</head>

<body>

<div class="card">

<h2 id="user-name">Не авторизован</h2>

<div id="timer">0 сек</div>

<button id="start-btn">Старт</button>
<button id="pause-btn">Пауза</button>
<button id="stop-btn">Стоп</button>

<hr>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Пароль">
<input id="name" placeholder="Имя">

<button id="login-btn">Войти</button>
<button id="signup-btn">Регистрация</button>
<button id="logout-btn">Выйти</button>

<hr>

<div id="chat"></div>

<input id="message-input" placeholder="Сообщение...">
<button id="send-btn">Отправить</button>

</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js";

const supabase = createClient(
  "https://jjaxitqamrxkktiltgdd.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpqYXhpdHFhbXJ4a2t0aWx0Z2RkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczNTkyNTYsImV4cCI6MjA5MjkzNTI1Nn0.9YorjGmJ7a8m-8JTUyDuTyfZs1GDVE-z483t5iczmfs"
);

// ===== USER =====
let currentUser = null;

async function loadUser() {
  const { data } = await supabase.auth.getUser();
  const user = data.user;

  if (!user) {
    document.getElementById("user-name").textContent = "Не авторизован";
    return;
  }

  currentUser = user;
  const name = user.user_metadata?.name || user.email;
  document.getElementById("user-name").textContent = name;
}

// ===== AUTH =====
login-btn.onclick = async () => {
  const { error } = await supabase.auth.signInWithPassword({
    email: email.value,
    password: password.value
  });

  if (error) return alert(error.message);
  loadUser();
};

signup-btn.onclick = async () => {
  const { error } = await supabase.auth.signUp({
    email: email.value,
    password: password.value,
    options: { data: { name: name.value } }
  });

  if (error) return alert(error.message);
  alert("Проверь почту");
};

logout-btn.onclick = async () => {
  await supabase.auth.signOut();
  loadUser();
};

// ===== TIMER =====
let sec = 0, int = null;

function update() {
  timer.textContent = sec + " сек";
}

start-btn.onclick = () => {
  if (int) return;
  int = setInterval(() => { sec++; update(); }, 1000);
};

pause-btn.onclick = () => {
  clearInterval(int); int = null;
};

stop-btn.onclick = () => {
  clearInterval(int); int = null;
  sec = 0; update();
};

// ===== CHAT =====
async function loadMessages() {
  const { data } = await supabase
    .from("messages")
    .select("*")
    .order("created_at");

  chat.innerHTML = "";
  data.forEach(msg => {
    chat.innerHTML += `<div><b>${msg.user_name}:</b> ${msg.text}</div>`;
  });
}

send-btn.onclick = async () => {
  if (!currentUser) return alert("Войди");

  const name = currentUser.user_metadata?.name || currentUser.email;

  await supabase.from("messages").insert({
    user_name: name,
    text: message-input.value
  });

  message-input.value = "";
  loadMessages();
};

// ===== INIT =====
loadUser();
update();
loadMessages();
</script>

</body>
</html>
