<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>мяу</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg, #ff9ecf, #ff4da6);
  color: white;
  text-align: center;
  padding: 30px;
}

.card {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  padding: 25px;
  border-radius: 20px;
  display: inline-block;
  width: 350px;
}

#timer {
  font-size: 40px;
  margin: 20px 0;
}

button {
  padding: 10px;
  margin: 5px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

#start-btn { background: #ff66b2; }
#pause-btn { background: #ff99cc; }
#stop-btn { background: #ff3385; }

input {
  padding: 8px;
  margin: 5px;
  border-radius: 8px;
  border: none;
  width: 90%;
}

#chat {
  margin-top: 20px;
  height: 200px;
  overflow-y: auto;
  background: rgba(0,0,0,0.2);
  padding: 10px;
  border-radius: 10px;
  text-align: left;
}
</style>
</head>

<body>

<div class="card">

<h2 id="user-name">Не авторизован</h2>

<div id="timer">0 сек</div>

<button id="start-btn">Старт</button>
<button id="pause-btn">Пауза</button>
<button id="stop-btn">Стоп</button>

<hr>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Пароль">
<input id="name" placeholder="Имя">

<button id="login-btn">Войти</button>
<button id="signup-btn">Регистрация</button>
<button id="logout-btn">Выйти</button>

<hr>

<div id="chat"></div>

<input id="message-input" placeholder="Сообщение...">
<button id="send-btn">Отправить</button>

</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js";

const supabase = createClient(
  "https://jjaxitqamrxkktiltgdd.supabase.co",
  "ТВОЙ_ANON_KEY"
);

// ===== USER =====
let currentUser = null;

async function loadUser() {
  const { data, error } = await supabase.auth.getUser();

  if (error) return console.log(error.message);

  const user = data.user;

  if (!user) {
    document.getElementById("user-name").textContent = "Не авторизован";
    currentUser = null;
    return;
  }

  currentUser = user;
  document.getElementById("user-name").textContent =
    user.user_metadata?.name || user.email;
}

// ===== AUTH =====
document.getElementById("signup-btn").onclick = async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const name = document.getElementById("name").value;

  const { error } = await supabase.auth.signUp({
    email,
    password,
    options: {
      data: { name }
    }
  });

  if (error) return alert(error.message);

  alert("Готово. Если включено подтверждение — проверь почту");
};

document.getElementById("login-btn").onclick = async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if (error) return alert(error.message);

  loadUser();
};

document.getElementById("logout-btn").onclick = async () => {
  await supabase.auth.signOut();
  currentUser = null;
  loadUser();
};

// ===== TIMER =====
let seconds = 0;
let interval = null;

function updateTimer() {
  document.getElementById("timer").textContent = seconds + " сек";
}

document.getElementById("start-btn").onclick = () => {
  if (interval) return;

  interval = setInterval(() => {
    seconds++;
    updateTimer();
  }, 1000);
};

document.getElementById("pause-btn").onclick = () => {
  clearInterval(interval);
  interval = null;
};

document.getElementById("stop-btn").onclick = () => {
  clearInterval(interval);
  interval = null;
  seconds = 0;
  updateTimer();
};

// ===== CHAT =====
async function loadMessages() {
  const { data, error } = await supabase
    .from("messages")
    .select("*")
    .order("created_at");

  if (error) return console.log(error.message);

  const chat = document.getElementById("chat");
  chat.innerHTML = "";

  data.forEach(msg => {
    chat.innerHTML += `<div><b>${msg.user_name}:</b> ${msg.text}</div>`;
  });
}

document.getElementById("send-btn").onclick = async () => {
  if (!currentUser) return alert("Сначала войди");

  const input = document.getElementById("message-input");
  const text = input.value;

  if (!text) return;

  const name = currentUser.user_metadata?.name || currentUser.email;

  const { error } = await supabase.from("messages").insert({
    user_name: name,
    text: text
  });

  if (error) return alert(error.message);

  input.value = "";
  loadMessages();
};

// ===== INIT =====
loadUser();
loadMessages();
updateTimer();
</script>

</body>
</html>
