<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>App</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg, #ff9ecf, #ff4da6);
  color: white;
  text-align: center;
  padding: 30px;
}

.card {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  padding: 25px;
  border-radius: 20px;
  width: 360px;
  margin: auto;
}

#timer {
  font-size: 40px;
  margin: 20px 0;
}

button {
  padding: 10px;
  margin: 5px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

#start { background:#ff66b2; }
#pause { background:#ff99cc; }
#stop { background:#ff3385; }

input {
  width: 90%;
  padding: 8px;
  margin: 5px;
  border-radius: 8px;
  border: none;
}

#chat {
  margin-top: 15px;
  height: 180px;
  overflow-y: auto;
  background: rgba(0,0,0,0.2);
  padding: 10px;
  border-radius: 10px;
  text-align: left;
}
</style>
</head>

<body>

<div class="card">

<h2 id="user">Не авторизован</h2>

<div id="timer">0 сек</div>

<button id="start">Старт</button>
<button id="pause">Пауза</button>
<button id="stop">Стоп</button>

<hr>

<input id="email" placeholder="email">
<input id="password" placeholder="password">
<input id="name" placeholder="name">

<button id="login">Войти</button>
<button id="signup">Регистрация</button>
<button id="logout">Выйти</button>

<hr>

<div id="chat"></div>

<input id="msg" placeholder="сообщение">
<button id="send">Отправить</button>

</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js";

const supabase = createClient(
  "https://jjaxitqamrxkktiltgdd.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpqYXhpdHFhbXJ4a2t0aWx0Z2RkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczNTkyNTYsImV4cCI6MjA5MjkzNTI1Nn0.9YorjGmJ7a8m-8JTUyDuTyfZs1GDVE-z483t5iczmfs"
);

// ===== USER =====
let userData = null;

async function getUser() {
  const { data } = await supabase.auth.getUser();
  userData = data.user;

  document.getElementById("user").textContent =
    userData ? (userData.user_metadata?.name || userData.email) : "Не авторизован";
}

// ===== AUTH =====
document.getElementById("signup").onclick = async () => {
  const { error } = await supabase.auth.signUp({
    email: email.value,
    password: password.value,
    options: { data: { name: name.value } }
  });

  if (error) return alert(error.message);
  alert("Готово (если включено подтверждение — проверь почту)");
};

document.getElementById("login").onclick = async () => {
  const { error } = await supabase.auth.signInWithPassword({
    email: email.value,
    password: password.value
  });

  if (error) return alert(error.message);
  getUser();
};

document.getElementById("logout").onclick = async () => {
  await supabase.auth.signOut();
  userData = null;
  getUser();
};

// ===== TIMER =====
let sec = 0;
let int = null;

document.getElementById("start").onclick = () => {
  if (int) return;
  int = setInterval(() => {
    sec++;
    document.getElementById("timer").textContent = sec + " сек";
  }, 1000);
};

document.getElementById("pause").onclick = () => {
  clearInterval(int);
  int = null;
};

document.getElementById("stop").onclick = () => {
  clearInterval(int);
  int = null;
  sec = 0;
  document.getElementById("timer").textContent = "0 сек";
};

// ===== CHAT =====
async function loadChat() {
  const { data } = await supabase
    .from("messages")
    .select("*")
    .order("created_at");

  const chat = document.getElementById("chat");
  chat.innerHTML = "";

  data.forEach(m => {
    chat.innerHTML += `<div><b>${m.user_name}:</b> ${m.text}</div>`;
  });
}

document.getElementById("send").onclick = async () => {
  if (!userData) return alert("войди");

  const text = document.getElementById("msg").value;
  if (!text) return;

  const name = userData.user_metadata?.name || userData.email;

  const { error } = await supabase.from("messages").insert({
    user_name: name,
    text
  });

  if (error) return alert(error.message);

  document.getElementById("msg").value = "";
  loadChat();
};

// ===== INIT =====
getUser();
loadChat();
</script>

</body>
</html>
