<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практика 2 - Финал</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #FF52A2; 
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            min-height: 100vh;
            box-sizing: border-box;
            color: #333;
        }

        .dashboard-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 380px; /* Сделали блоки чуть шире и массивнее */
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            box-sizing: border-box;
        }

        .profile-card { text-align: center; }
        .profile-card h4 { margin: 0 0 5px 0; color: #555; font-size: 15px; }

        .timer-val {
            font-size: 32px;
            font-weight: bold;
            color: #FF007F;
            margin: 12px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-main {
            width: 100%;
            background: #FF007F;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .btn-row { display: flex; gap: 8px; }
        .btn-sub {
            flex: 1;
            background: #F0F0F0;
            color: #555;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-sub.active { background: #FFB6C1; color: #FF007F; }

        .auth-inputs input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #DDD;
            border-radius: 6px;
            box-sizing: border-box;
        }

        /* МОНИТОР ГРУППЫ */
        .monitor-card h3, .chat-card h3 {
            margin: 0 0 12px 0;
            font-size: 15px;
            color: #444;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .user-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 160px;
            overflow-y: auto;
        }

        .user-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            padding: 6px 0;
            border-bottom: 1px solid #F5F5F5;
        }

        .user-info { display: flex; align-items: center; gap: 8px; }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #CCC; 
            transition: background 0.3s;
        }
        .status-dot.online {
            background: #2ECC71; 
            box-shadow: 0 0 8px #2ECC71;
        }

        /* БОЛЬШОЙ ОБЩИЙ ЧАТ */
        .chat-card {
            display: flex;
            flex-direction: column;
            height: 400px; /* Увеличили высоту чата */
        }

        .chat-box {
            flex: 1;
            background: #F9F9F9;
            border: 1px solid #EAEAEA;
            border-radius: 8px;
            padding: 12px;
            overflow-y: auto;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-msg {
            background: #FFF0F5;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.4;
            max-width: 85%;
            align-self: flex-start;
            border-left: 4px solid #FF52A2;
        }
        .chat-msg .author {
            font-weight: bold;
            color: #FF007F;
            font-size: 11px;
            margin-bottom: 3px;
        }

        .chat-input-row { display: flex; gap: 6px; }
        .chat-input-row input {
            flex: 1;
            padding: 10px;
            border: 1px solid #DDD;
            border-radius: 6px;
            font-size: 13px;
        }
        .chat-input-row button {
            background: #2ECC71;
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="dashboard-column">
        
        <div class="card profile-card">
            <h4 id="user-display">Проверка аккаунта...</h4>
            <div class="timer-val">
                <span>⏱️</span> <span id="seconds">0</span> сек.
            </div>
            
            <button class="btn-main" id="btn-toggle-session" onclick="toggleSession()">Завершить сессию</button>
            
            <div class="btn-row">
                <button class="btn-sub" id="btn-pause" onclick="pauseSession()">Перерыв</button>
                <button class="btn-sub" onclick="signOut()">Выход</button>
            </div>

            <div id="auth-form" style="display:none; margin-top:15px; border-top:1px solid #EEE; padding-top:15px;">
                <div class="auth-inputs">
                    <input type="email" id="email" placeholder="Любая почта (alex@test.com)">
                    <input type="password" id="password" placeholder="Пароль">
                </div>
                <div class="btn-row" style="margin-top:5px;">
                    <button class="btn-sub" style="background:#FF007F; color:white;" onclick="signIn()">Войти</button>
                    <button class="btn-sub" onclick="signUp()">Рега</button>
                </div>
            </div>
        </div>

        <div class="card monitor-card">
            <h3>👥 Монитор группы</h3>
            <div class="user-list" id="monitor-list">
                <div style="color:#aaa; font-size:12px; text-align:center;">Загрузка списка группы...</div>
            </div>
        </div>

        <div class="card chat-card">
            <h3>💬 Общий чат</h3>
            <div class="chat-box" id="chat-box">
                <div style="color:#aaa; font-size:11px; text-align:center; margin-top:100px;">Войдите в систему для просмотра сообщений.</div>
            </div>
            <div class="chat-input-row">
                <input type="text" id="msg-text" placeholder="Сообщение..." onkeypress="if(event.key === 'Enter') sendChatMessage()">
                <button onclick="sendChatMessage()">➔</button>
            </div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = "https://eehbqfrrojaykcipwpvp.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlaGJxZnJyb2pheWtjaXB3cHZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNjk4MzksImV4cCI6MjA5MTk0NTgzOX0.L5vqwPKu7Ps3izTIwMvdtt71u7YPXXZ__k1yNqpmzQE";
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let timerInterval = null;
        let isPaused = false;
        let totalSeconds = parseInt(localStorage.getItem('studySeconds')) || 0;

        document.getElementById('seconds').innerText = totalSeconds;

        function startTimer() {
            if(timerInterval) clearInterval(timerInterval);
            isPaused = false;
            document.getElementById('btn-pause').classList.remove('active');
            document.getElementById('btn-toggle-session').innerText = "Завершить сессию";
            document.getElementById('btn-toggle-session').style.background = "#FF007F";

            timerInterval = setInterval(() => {
                totalSeconds++;
                document.getElementById('seconds').innerText = totalSeconds;
                localStorage.setItem('studySeconds', totalSeconds);
            }, 1000);
        }

        function pauseSession() {
            if (!currentUser) return;
            if (!isPaused) {
                clearInterval(timerInterval);
                isPaused = true;
                document.getElementById('btn-pause').classList.add('active');
                document.getElementById('btn-toggle-session').innerText = "Продолжить учебу";
                document.getElementById('btn-toggle-session').style.background = "#2ECC71";
            } else {
                startTimer();
            }
        }

        function toggleSession() {
            if (!currentUser) return;
            if (isPaused) {
                startTimer();
            } else {
                clearInterval(timerInterval);
                totalSeconds = 0;
                document.getElementById('seconds').innerText = totalSeconds;
                localStorage.setItem('studySeconds', totalSeconds);
                startTimer();
            }
        }

        async function updatePresence(user) {
            if (!user) return;
            await _supabase.from('profiles').upsert({
                id: user.id,
                email: user.email,
                last_seen: new Date().toISOString()
            });
            loadGroupMonitor(); 
        }

        async function signUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = await _supabase.auth.signUp({ email, password });
            if (error) alert("Ошибка рега: " + error.message);
            else { alert("Аккаунт создан!"); if(data.user) await updatePresence(data.user); checkUser(); }
        }

        async function signIn() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) alert("Ошибка входа: " + error.message);
            else { if(data.user) await updatePresence(data.user); checkUser(); }
        }

        async function signOut() {
            clearInterval(timerInterval);
            await _supabase.auth.signOut();
            currentUser = null;
            checkUser();
        }

        async function checkUser() {
            const { data: { user } } = await _supabase.auth.getUser();
            if (user) {
                currentUser = user;
                document.getElementById('user-display').innerText = user.email;
                document.getElementById('auth-form').style.display = 'none';
                startTimer();
                loadMessages();
                loadGroupMonitor();
                listenRealtime(); 
            } else {
                currentUser = null;
                document.getElementById('user-display').innerText = "Вход в систему";
                document.getElementById('auth-form').style.display = 'block';
                document.getElementById('chat-box').innerHTML = `<div style="color:#aaa; font-size:11px; text-align:center; margin-top:100px;">Войдите в систему для просмотра сообщений.</div>`;
                document.getElementById('monitor-list').innerHTML = `<div style="color:#aaa; font-size:11px; text-align:center;">Список недоступен.</div>`;
            }
        }

        // МОНИТОР ГРУППЫ С АКТУАЛЬНЫМИ СТАТУСАМИ
        async function loadGroupMonitor() {
            if(!currentUser) return;
            const { data: profiles, error } = await _supabase.from('profiles').select('*').order('last_seen', { ascending: false });
            if (error) return;

            const listContainer = document.getElementById('monitor-list');
            listContainer.innerHTML = "";

            profiles.forEach(p => {
                // Если юзер заходил или обновлялся в течение последних 3 минут — он Онлайн
                const isOnline = (new Date() - new Date(p.last_seen)) < 3 * 60 * 1000;
                const shortName = p.email.split('@')[0];

                const row = document.createElement('div');
                row.classList.add('user-row');
                row.innerHTML = `
                    <div class="user-info">
                        <span class="status-dot ${isOnline ? 'online' : ''}"></span>
                        <span style="font-weight: bold;">${shortName}</span>
                    </div>
                    <span style="font-size:11px; color: #666;">${isOnline ? '🏠 Дома' : 'был недавно'}</span>
                `;
                listContainer.appendChild(row);
            });
        }

        // ОБЩИЙ ЧАТ
        async function loadMessages() {
            if (!currentUser) return;
            const { data: messages, error } = await _supabase.from('messages').select('*').order('created_at', { ascending: true }).limit(50);
            if (error) return;

            const box = document.getElementById('chat-box');
            box.innerHTML = "";
            if (messages) {
                messages.forEach(msg => appendMessage(msg));
                box.scrollTop = box.scrollHeight;
            }
        }

        function appendMessage(msg) {
            const box = document.getElementById('chat-box');
            const msgEl = document.createElement('div');
            msgEl.classList.add('chat-msg');
            msgEl.innerHTML = `
                <div class="author">${msg.user_email.split('@')[0]}</div>
                <div>${msg.text}</div>
            `;
            box.appendChild(msgEl);
            box.scrollTop = box.scrollHeight;
        }

        async function sendChatMessage() {
            const input = document.getElementById('msg-text');
            const text = input.value.trim();
            if (!text || !currentUser) return;

            const { error } = await _supabase.from('messages').insert({
                user_email: currentUser.email,
                text: text
            });
            if (error) alert("Ошибка: " + error.message);
            else input.value = "";
        }

        // ПОДКЛЮЧЕНИЕ ВЕБ-СОКЕТОВ ДЛЯ ОБНОВЛЕНИЯ НА ЛЕТУ
        function listenRealtime() {
            _supabase.channel('chat-channel')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    appendMessage(payload.new);
                })
                .subscribe();

            _supabase.channel('monitor-channel')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, payload => {
                    loadGroupMonitor();
                })
                .subscribe();

            // Каждые 60 секунд пингуем базу, подтверждая, что мы онлайн
            setInterval(() => {
                if (currentUser) updatePresence(currentUser);
            }, 60000);
        }

        checkUser();
    </script>
</body>
</html>
